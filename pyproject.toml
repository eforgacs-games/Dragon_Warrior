[project]
name = "dragon-warrior"
version = "0.1.0"
description = "A Python remake of Dragon Warrior for the NES, built with Pygame"
readme = "README.md"
# PEP 639: the code is GPLv3 or later. Game assets aren't covered by it; see ASSETS.md
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# pygame 2.6.1 has no wheels for Python 3.14 yet
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame~=2.6.1",
]

[dependency-groups]
# Only for the release builds (.github/workflows/release.yml, dragon_warrior.spec): `uv sync --group build`
build = [
    "pyinstaller~=6.22",
]
dev = [
    "fonttools~=4.67",
    "mypy~=2.4",
    "pre-commit~=4.7",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-timeout~=2.4",
    "pytest-xdist~=3.8",
    "ruff==0.16.10",  # exact: new ruff releases can add lint rules
]

[tool.uv]
package = false  # a game run from source, not an installable package

[tool.pytest.ini_options]
# Only used with -n (pytest-xdist): keep each test class on one worker, so its setUpClass runs once
addopts = "--dist loadscope"
# pytest-timeout: a test that runs over 60 s (a wait loop that never ends, say) fails and prints its stack, instead of
# hanging CI. Mark one that legitimately needs longer with @pytest.mark.timeout(N)
timeout = 60

[tool.mypy]
python_version = "3.13"
files = ["src", "tools"]
exclude = ["src/map_layouts.py"]
ignore_missing_imports = true
# A method that overrides a base class method must say so with @typing.override, so a misspelled or removed base
# method is a type error instead of a silent new method
enable_error_code = ["explicit-override"]

[tool.ruff]
target-version = "py313"
line-length = 127
extend-exclude = [
    "reference",  # offline utility scripts and generated data, not part of the game
]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "UP",    # pyupgrade: Python 3.13 syntax (builtin generics, X | None, functools.cache, StrEnum)
    "FURB",  # refurb: stable rules only (3 hits when enabled)
    "PERF",  # perflint: manual list building (1 hit when enabled)
]

[tool.ruff.lint.per-file-ignores]
# Data tables: map tile grids and per-level stat tables
"src/map_layouts.py" = ["E501"]
"tests/test_player_stats.py" = ["E501"]
