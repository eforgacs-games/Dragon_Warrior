# Opens weekly PRs to update pinned dependencies. Each ecosystem's updates are grouped into one PR,
# and new releases must be at least two weeks old before they're proposed.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # pyproject.toml and uv.lock. Dependabot can't update requirements.txt (exported from uv.lock), so
  # the sync-requirements job in python-app.yml regenerates and commits it on these PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns: ["*"]

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
