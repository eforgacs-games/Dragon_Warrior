# Opens weekly PRs to update pinned dependencies. Each ecosystem's updates are grouped into one PR,
# and new releases must be at least two weeks old before they're proposed.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # pyproject.toml and uv.lock. If a game dependency changes, regenerate requirements.txt with the
  # uv export command in its header; CI fails until it matches uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns: ["*"]

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
