# Builds the game with PyInstaller (dragon_warrior.spec) for Windows, macOS and Linux, and checks each build starts,
# finds and loads all of its files, plays every NES and SFC track through its bundled libgme and plays a few scripted
# scenes, in English and in Korean (--smoke-test, src/smoke_test.py), before anything is uploaded.
# libgme (Game_Music_Emu, LGPL 2.1+), which plays the NES and SFC music (src/chiptune.py), is built here from its
# source at GME_TAG, as a shared library, and bundled next to its license.
# - A pushed vX.Y.Z tag also publishes the builds as a GitHub Release for that tag.
# - Run by hand (Actions > Release builds > Run workflow), or on a PR that changes the build or what it bundles, the
#   builds are uploaded as workflow artifacts only, to try them without making a release.

name: Release builds

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/release.yml"
      - "dragon_warrior.spec"
      - "src/paths.py"
      - "src/catalog.py"
      - "src/directories.py"
      - "src/chiptune.py"
      - "src/chiptune_soundtracks.py"
      - "src/music_stream.py"
      - "src/smoke_test.py"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  GME_TAG: "0.6.4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build part way; a newer push to a PR replaces the older run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the build runs on distributions with an older glibc too
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Headless: the smoke test opens the game window and plays music on SDL's dummy drivers
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.11.26"
        python-version: "3.13"
        enable-cache: true
    - name: Install the game and PyInstaller
      # The game's dependencies and the build group, without the dev tools
      run: uv sync --locked --no-dev --group build
    - name: Build libgme
      # A shared library, so a player can swap in another build of it (LGPL). No zlib (only compressed VGM files need
      # it), and the Nuked YM2612 emulator, which is LGPL like the rest (MAME's is GPL). Its build with only some
      # emulators doesn't link on macOS (the exported symbols list names them all), so it has them all. On Linux the
      # C++ runtime is linked in, so the build runs on systems with an older libstdc++; on Windows the MSVC runtime is,
      # so no msvcp140.dll is needed.
      # GME_LIBRARY and GME_LICENSE tell dragon_warrior.spec what to bundle.
      run: |
        git clone --depth 1 --branch "$GME_TAG" https://github.com/libgme/game-music-emu.git gme-source
        case "$RUNNER_OS" in
          Linux) platform_flags=(-DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc") ;;
          Windows) platform_flags=(-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded) ;;
          macOS) platform_flags=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
        esac
        cmake -S gme-source -B gme-build -DCMAKE_BUILD_TYPE=Release -DGME_BUILD_SHARED=ON -DGME_BUILD_STATIC=OFF \
          -DGME_BUILD_TESTING=OFF -DGME_BUILD_EXAMPLES=OFF -DGME_ZLIB=OFF -DGME_YM2612_EMU=Nuked \
          "${platform_flags[@]}"
        cmake --build gme-build --config Release
        cmake --install gme-build --config Release --prefix gme-install
        # The file name src/chiptune.py loads (a real file, not the install's symlink)
        case "$RUNNER_OS" in
          Linux) installed=(gme-install/lib*/libgme.so.0) library=libgme.so.0 ;;
          Windows) installed=(gme-install/bin/gme.dll) library=gme.dll ;;
          macOS) installed=(gme-install/lib/libgme.0.dylib) library=libgme.0.dylib ;;
        esac
        mkdir libgme
        cp -L "${installed[0]}" "libgme/$library"
        cp gme-source/license.txt libgme/libgme-license.txt
        ls -l libgme
        # Relative to the repository root, where PyInstaller runs (an absolute path from bash isn't one on Windows)
        echo "GME_LIBRARY=libgme/$library" >> "$GITHUB_ENV"
        echo "GME_LICENSE=libgme/libgme-license.txt" >> "$GITHUB_ENV"
    - name: Name the build
      id: name
      env:
        # The tag (v1.2.3) for a release, the commit otherwise
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      run: echo "archive=DragonWarrior-${VERSION:0:12}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
    - name: Build with PyInstaller
      run: uv run --no-sync pyinstaller dragon_warrior.spec --noconfirm
    - name: Package
      env:
        ARCHIVE: ${{ steps.name.outputs.archive }}
      run: |
        mkdir package
        case "$RUNNER_OS" in
          Linux)
            # tar keeps the executable's permissions
            tar -czf "package/$ARCHIVE.tar.gz" -C dist DragonWarrior ;;
          Windows)
            (cd dist && 7z a -tzip -mx=9 "../package/$ARCHIVE.zip" DragonWarrior > /dev/null) ;;
          macOS)
            # ditto keeps the .app's symlinks and permissions
            ditto -c -k --keepParent "dist/Dragon Warrior.app" "package/$ARCHIVE.zip" ;;
        esac
        ls -l package
    - name: Smoke test the packaged build
      # Unpacks the archive and runs the game from it, so it proves the download itself works. Each run checks every
      # data file loads and renders the start of every NES and SFC track with the bundled libgme, then plays the throne room (TALK, the COMMAND window), the stairs down to the courtyard and a
      # fight on Alefgard through the virtual joypad, and exits with 1 on a missing file or any exception. Once in
      # English (the NES font) and once in Korean (Unifont and the catalog compiled from the bundled base.po). The
      # runners have no display or sound card, so SDL's dummy drivers (the job's env) stand in on all three OSes.
      timeout-minutes: 5
      env:
        ARCHIVE: ${{ steps.name.outputs.archive }}
      run: |
        # Relative paths throughout: bash on Windows and 7z disagree about absolute ones
        mkdir smoke
        case "$RUNNER_OS" in
          Linux)
            tar -xzf "package/$ARCHIVE.tar.gz" -C smoke
            game="./DragonWarrior/DragonWarrior" ;;
          Windows)
            7z x "package/$ARCHIVE.zip" -osmoke > /dev/null
            game="./DragonWarrior/DragonWarrior.exe" ;;
          macOS)
            ditto -x -k "package/$ARCHIVE.zip" smoke
            game="./Dragon Warrior.app/Contents/MacOS/DragonWarrior" ;;
        esac
        # From the unpacked folder, so nothing can be found through the repository
        cd smoke
        "$game" --smoke-test --language English
        "$game" --smoke-test --language Korean
    - name: Upload the build
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.name.outputs.archive }}
        path: package/*
        compression-level: 0  # already compressed
        if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload the builds to it
    steps:
    - name: Download the builds
      uses: actions/download-artifact@v8
      with:
        path: package
        merge-multiple: true
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        ls -l package
        # A re-run uploads to the release made by the first run instead of failing
        if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Dragon Warrior $TAG" --generate-notes
        fi
        gh release upload "$TAG" package/* --repo "$GITHUB_REPOSITORY" --clobber
