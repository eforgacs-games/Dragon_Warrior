# Installs the locked dependencies with uv, then lints, type checks and tests on Python 3.13 (the only version the
# game supports: pygame 2.6.1 has no wheels for 3.14 yet). It also publishes a coverage summary to the job summary and,
# on PRs, a sticky comment.
# On Dependabot's uv PRs, sync-requirements first regenerates requirements.txt from uv.lock and commits it.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # sync-requirements dispatches this to test the commit it pushes: pushes made with GITHUB_TOKEN start no runs
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the PR's run still in progress. Every other run (pushes to main, and the run
# sync-requirements dispatches on a Dependabot branch) gets its own group (its run_id), so none is ever cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependabot updates uv.lock but not requirements.txt, so regenerate it on Dependabot's uv PRs.
  # Uses pull_request, not pull_request_target, so a fork PR never gets a write token here. The PR's
  # author and head repository are checked instead of github.actor, which changes with who pushed last.
  # The job only runs `uv export`, which reads pyproject.toml and uv.lock and builds or runs nothing.
  sync-requirements:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the regenerated requirements.txt to the Dependabot branch
      actions: write   # dispatch this workflow for that commit
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}  # the branch itself rather than the merge commit, so the result can be pushed
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.11.26"
        python-version: "3.13"
    - name: Regenerate requirements.txt
      # The command in requirements.txt's header
      run: uv export --locked --no-dev --no-hashes --no-annotate -o requirements.txt
    - name: Commit, push and dispatch CI if it changed
      id: commit
      env:
        HEAD_REF: ${{ github.head_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet -- requirements.txt; then
          echo "requirements.txt already matches uv.lock"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Regenerate requirements.txt from uv.lock" -- requirements.txt
        git push origin "HEAD:refs/heads/$HEAD_REF"
        gh workflow run python-app.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Whether anything besides documentation changed. build is a required check, so the workflow always runs: on a
  # docs-only change build is skipped, which GitHub counts as passing (a paths-ignore on the trigger would leave the
  # required check waiting forever). data/ is not documentation: the tests load the maps, text and music.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: List the changed files
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$PUSH_BEFORE" ;;
          *) base="" ;;  # a dispatched run tests everything
        esac
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "No base to compare with: testing everything"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git diff --name-only "$base" HEAD > changed.txt
        cat changed.txt
        # Documentation only: Markdown anywhere, docs/, and the licence. Everything else counts as code.
        if grep -v -E '(\.md$|^docs/|^LICENSE$)' changed.txt | grep -q .; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "Only documentation changed: build is skipped"
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: [sync-requirements, changes]
    # Runs when sync-requirements is skipped or changes nothing (after a push, the dispatched run tests the new commit),
    # and when more than documentation changed
    if: ${{ !cancelled() && needs.sync-requirements.outputs.pushed != 'true' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # for the sticky coverage comment

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.11.26"
        python-version: "3.13"
        enable-cache: true
    - name: Install dependencies
      # --locked fails if uv.lock is out of date with pyproject.toml
      run: uv sync --locked
    - name: Install libgme
      # The NES and SFC music's emulator (src/chiptune.py), so the tests play the real thing
      run: sudo apt-get update && sudo apt-get install -y libgme0
    - name: Check requirements.txt matches uv.lock
      run: |
        diff <(grep -v '^#' requirements.txt) <(uv export --locked --no-dev --no-hashes --no-annotate | grep -v '^#') \
          || { echo "requirements.txt is out of date; regenerate it with the uv export command in its header"; exit 1; }
    - name: Lint with ruff
      run: uv run ruff check . --output-format=github
    - name: Type check with mypy
      # Settings live in pyproject.toml
      run: uv run mypy
    - name: Test with pytest
      env:
        COVERAGE_CORE: sysmon  # coverage.py's sys.monitoring tracer (Python 3.12+), much cheaper than its default
        REQUIRE_LIBGME: "1"  # the tests that need libgme fail instead of skipping (tests/helpers.py requires_libgme)
      # -n auto: pytest-xdist runs the tests on every CPU (4 on GitHub's runners); --dist loadscope and the 60 s
      # per-test timeout (pytest-timeout) are in pyproject.toml.
      # --cov-fail-under: total line coverage was 96.9% when this was added; the floor is a couple of points below
      # it (about 150 lines), so a big untested addition fails but ordinary changes don't. Raise it as coverage grows.
      # --durations: lists the slowest tests in the log, to see how close any gets to the timeout
      run: uv run pytest -n auto --cov=src --cov-report=term --cov-report=xml --cov-fail-under=95 --durations=10
    # The coverage steps also run when the tests fail (coverage below the floor, say), as long as coverage.xml was written
    - name: Build coverage summary
      if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        badge: true
        format: markdown
        output: both
        hide_complexity: true  # coverage.py does not report complexity
        thresholds: "95 97"  # badge colours: red below the floor in the pytest step, yellow up to 97%, green above
    - name: Write coverage summary to the job summary
      if: ${{ !cancelled() && hashFiles('code-coverage-results.md') != '' }}
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
    - name: Post coverage summary as a PR comment
      # Fork PRs get a read-only token, so only comment on PRs from this repository
      if: >-
        !cancelled()
        && hashFiles('code-coverage-results.md') != ''
        && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        header: coverage
        path: code-coverage-results.md
