# Installs the locked dependencies with uv, then lints, type checks and tests on each supported Python version.
# One matrix entry also publishes a coverage summary to the job summary and, on PRs, a sticky comment.
# On Dependabot's uv PRs, sync-requirements first regenerates requirements.txt from uv.lock and commits it.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # sync-requirements dispatches this to test the commit it pushes: pushes made with GITHUB_TOKEN start no runs
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the PR's run still in progress. Every other run (pushes to main, and the run
# sync-requirements dispatches on a Dependabot branch) gets its own group (its run_id), so none is ever cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependabot updates uv.lock but not requirements.txt, so regenerate it on Dependabot's uv PRs.
  # Uses pull_request, not pull_request_target, so a fork PR never gets a write token here. The PR's
  # author and head repository are checked instead of github.actor, which changes with who pushed last.
  # The job only runs `uv export`, which reads pyproject.toml and uv.lock and builds or runs nothing.
  sync-requirements:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the regenerated requirements.txt to the Dependabot branch
      actions: write   # dispatch this workflow for that commit
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}  # the branch itself rather than the merge commit, so the result can be pushed
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.11.26"
        python-version: "3.13"
    - name: Regenerate requirements.txt
      # The command in requirements.txt's header
      run: uv export --locked --no-dev --no-hashes --no-annotate -o requirements.txt
    - name: Commit, push and dispatch CI if it changed
      id: commit
      env:
        HEAD_REF: ${{ github.head_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet -- requirements.txt; then
          echo "requirements.txt already matches uv.lock"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Regenerate requirements.txt from uv.lock" -- requirements.txt
        git push origin "HEAD:refs/heads/$HEAD_REF"
        gh workflow run python-app.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        echo "pushed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync-requirements
    # Runs when sync-requirements is skipped or changes nothing. After a push, the dispatched run tests the new commit
    if: ${{ !cancelled() && needs.sync-requirements.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pygame 2.6.1 has no wheels for 3.14 yet
        python-version: ["3.10", "3.13"]
        include:
          # Only one matrix entry publishes the coverage summary, so a PR gets a single comment
          - python-version: "3.13"
            publish-coverage: true
    permissions:
      contents: read
      pull-requests: write  # for the sticky coverage comment

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.11.26"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      # --locked fails if uv.lock is out of date with pyproject.toml
      run: uv sync --locked
    - name: Check requirements.txt matches uv.lock
      run: |
        diff <(grep -v '^#' requirements.txt) <(uv export --locked --no-dev --no-hashes --no-annotate | grep -v '^#') \
          || { echo "requirements.txt is out of date; regenerate it with the uv export command in its header"; exit 1; }
    - name: Lint with ruff
      run: uv run ruff check . --output-format=github
    - name: Type check with mypy
      # Settings live in pyproject.toml
      run: uv run mypy
    - name: Test with pytest
      if: ${{ !matrix.publish-coverage }}
      # -n auto: pytest-xdist runs the tests on every CPU (4 on GitHub's runners)
      run: uv run pytest -n auto  # --dist loadscope is in pyproject.toml
    - name: Test with pytest and coverage
      if: matrix.publish-coverage
      env:
        COVERAGE_CORE: sysmon  # coverage.py's sys.monitoring tracer (Python 3.12+), much cheaper than its default
      run: uv run pytest -n auto --cov=src --cov-report=term --cov-report=xml
    - name: Build coverage summary
      if: matrix.publish-coverage
      # Report only for now; add thresholds (e.g. "60 80") and fail_below_min to enforce a minimum
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        badge: true
        format: markdown
        output: both
        hide_complexity: true  # coverage.py does not report complexity
    - name: Write coverage summary to the job summary
      if: matrix.publish-coverage
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
    - name: Post coverage summary as a PR comment
      # Fork PRs get a read-only token, so only comment on PRs from this repository
      if: >-
        matrix.publish-coverage && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        header: coverage
        path: code-coverage-results.md
