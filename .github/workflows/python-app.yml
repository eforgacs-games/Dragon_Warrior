# Installs the locked dependencies with uv, then lints, type checks and tests on each supported Python version.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pygame 2.6.1 has no wheels for 3.14 yet
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.11.26"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      # --locked fails if uv.lock is out of date with pyproject.toml
      run: uv sync --locked
    - name: Check requirements.txt matches uv.lock
      run: |
        diff <(grep -v '^#' requirements.txt) <(uv export --locked --no-dev --no-hashes --no-annotate | grep -v '^#') \
          || { echo "requirements.txt is out of date; regenerate it with the uv export command in its header"; exit 1; }
    - name: Lint with ruff
      run: uv run ruff check . --output-format=github
    - name: Type check with mypy
      # Settings live in pyproject.toml
      run: uv run mypy
    - name: Test with pytest
      run: uv run pytest --cov=src --cov-report=term
