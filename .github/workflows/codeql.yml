name: "CodeQL"

on:
  # CodeQL analyzes the Python code only, so documentation and game data can't change its result. It isn't a required
  # check, so a skipped run doesn't block merging; the weekly scheduled run still analyzes everything.
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "data/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "data/**"
  schedule:
    - cron: "37 7 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          # The cyclic-import queries count imports under `if TYPE_CHECKING:` (type hints only, never run) as real ones,
          # so every module that types its `game: 'Game'` "closes a cycle" through src.game. A real import cycle would
          # fail on import, which the tests and the smoke test catch.
          config: |
            query-filters:
              - exclude:
                  id: py/unsafe-cyclic-import
              - exclude:
                  id: py/cyclic-import

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
